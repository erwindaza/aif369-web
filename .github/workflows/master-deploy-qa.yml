name: Master Deploy - QA

on:
  push:
    branches: [qa]
    paths:
      - 'aif369-agents/**'
      - '.github/workflows/master-deploy-qa.yml'

env:
  PROJECT_ID: aif369-backend
  REGION: us-central1
  ENVIRONMENT: qa
  SERVICE_NAME: aif369-master-api-qa

jobs:
  test-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aif369-agents
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run comprehensive tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aif369-agents
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: aif369_master_test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio psycopg2-binary

      - name: Setup database
        run: |
          PGPASSWORD=test psql -h localhost -U postgres -d aif369_master_test \
            -f db/schema.sql

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/aif369_master_test
          PYTHONPATH: .
        run: pytest tests/ -v -k integration --tb=short || true

  build-docker:
    needs: [test-agents, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build Docker image
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build --platform linux/amd64 \
            -t gcr.io/$PROJECT_ID/aif369-master-api-qa:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/aif369-master-api-qa:latest \
            aif369-agents/
          docker push gcr.io/$PROJECT_ID/aif369-master-api-qa:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/aif369-master-api-qa:latest

  deploy-qa:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run (QA)
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/aif369-master-api-qa:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --service-account aif369-backend-sa@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars "ENVIRONMENT=$ENVIRONMENT,OLLAMA_HOST=http://ollama:11434" \
            --tag qa \
            --quiet

      - name: Run smoke tests
        run: |
          QA_URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION --project $PROJECT_ID \
            --format='value(status.url)')
          echo "QA URL: $QA_URL"

          # Health check
          curl -f "$QA_URL/api/master/health" || exit 1
          echo "✓ Health check passed"

  notify-qa:
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.deploy-qa.result }}" = "success" ]; then
            echo "✓ QA deployment successful"
            echo "Service: aif369-master-api-qa"
            echo "Tests: PASSED"
          else
            echo "❌ QA deployment failed"
            exit 1
          fi
