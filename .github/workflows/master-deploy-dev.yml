name: Master Deploy - DEV

on:
  push:
    branches: [dev]
    paths:
      - 'aif369-agents/**'
      - '.github/workflows/master-deploy-dev.yml'

env:
  PROJECT_ID: aif369-backend
  REGION: us-central1
  ENVIRONMENT: dev
  SERVICE_NAME: aif369-master-api-dev

jobs:
  test-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aif369-agents
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run agent tests
        run: pytest tests/test_master_agents.py -v --tb=short

  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate curriculum schema
        run: |
          python -c "import json; json.load(open('aif369_master_data_ai_governance.json'))"
          echo '✓ Curriculum schema valid'

  build-docker:
    needs: [test-agents, validate-schema]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build Docker image
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build --platform linux/amd64 \
            -t gcr.io/$PROJECT_ID/aif369-master-api-dev:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/aif369-master-api-dev:latest \
            aif369-agents/
          docker push gcr.io/$PROJECT_ID/aif369-master-api-dev:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/aif369-master-api-dev:latest

  deploy-dev:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run (DEV)
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/aif369-master-api-dev:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --service-account aif369-backend-sa@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars "ENVIRONMENT=$ENVIRONMENT,OLLAMA_HOST=http://ollama:11434" \
            --tag dev \
            --quiet

      - name: Health check
        run: |
          DEV_URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION --project $PROJECT_ID \
            --format='value(status.url)')
          echo "DEV URL: $DEV_URL"
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEV_URL/api/master/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying..."
            sleep 5
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1

  notify-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Status
        run: |
          if [ "${{ needs.deploy-dev.result }}" = "success" ]; then
            echo "✓ DEV deployment successful"
            echo "Service: aif369-master-api-dev"
            echo "Region: us-central1"
            echo "URL: https://aif369-master-api-dev-xyz.run.app/api/master/health"
          else
            echo "❌ DEV deployment failed"
            exit 1
          fi
