name: Master Deploy - PROD

on:
  push:
    branches: [main]
    paths:
      - 'aif369-agents/**'
      - '.github/workflows/master-deploy-prod.yml'

env:
  PROJECT_ID: aif369-backend
  REGION: us-central1
  ENVIRONMENT: production
  SERVICE_NAME: aif369-master-api

jobs:
  test-agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aif369-agents
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run all tests
        run: PYTHONPATH=. pytest tests/ -v --tb=short --cov=agents --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./aif369-agents/coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aif369-agents
    steps:
      - uses: actions/checkout@v4

      - name: Run bandit security scan
        run: |
          pip install bandit
          bandit -r agents/ -f json -o bandit-report.json || true
          cat bandit-report.json | grep -q '"severity": "HIGH"' && exit 1 || echo "✓ No high-severity issues"

  build-docker:
    needs: [test-agents, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build Docker image
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build --platform linux/amd64 \
            -t gcr.io/$PROJECT_ID/aif369-master-api:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/aif369-master-api:latest \
            -t gcr.io/$PROJECT_ID/aif369-master-api:prod-${{ github.run_number }} \
            aif369-agents/
          docker push gcr.io/$PROJECT_ID/aif369-master-api:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/aif369-master-api:latest
          docker push gcr.io/$PROJECT_ID/aif369-master-api:prod-${{ github.run_number }}

  deploy-prod:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run (PROD)
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/aif369-master-api:${{ github.sha }} \
            --platform managed \
            --region $REGION \
            --project $PROJECT_ID \
            --allow-unauthenticated \
            --service-account aif369-backend-sa@$PROJECT_ID.iam.gserviceaccount.com \
            --set-env-vars "ENVIRONMENT=$ENVIRONMENT" \
            --tag prod \
            --tag v${{ github.run_number }} \
            --quiet

      - name: Verify deployment
        run: |
          PROD_URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION --project $PROJECT_ID \
            --format='value(status.url)')
          echo "PROD URL: $PROD_URL"

          # Health check with retries
          for i in {1..15}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/master/health")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Production health check passed"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE"
            sleep 10
          done
          echo "❌ Production health check failed"
          exit 1

  smoke-tests-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aif369-agents
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Run production smoke tests
        env:
          PROD_URL: https://aif369-master-api-xyz.run.app
        run: |
          python -c "
          import asyncio
          import httpx

          async def test_prod():
              async with httpx.AsyncClient() as client:
                  # Test health
                  resp = await client.get('$PROD_URL/api/master/health')
                  assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
                  print('✓ Health check passed')

          asyncio.run(test_prod())
          "

  notify-prod:
    needs: [deploy-prod, smoke-tests-prod]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          if [ "${{ needs.deploy-prod.result }}" = "success" ] && [ "${{ needs.smoke-tests-prod.result }}" = "success" ]; then
            echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
            echo "Service: aif369-master-api"
            echo "Environment: production"
            echo "Region: us-central1"
            echo "Build: ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
          else
            echo "❌ PRODUCTION DEPLOYMENT FAILED"
            exit 1
          fi

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            aif369-agents/requirements.txt
          body: |
            # AIF369 Master API - Production Release

            **Build**: ${{ github.run_number }}
            **Commit**: ${{ github.sha }}
            **Branch**: main

            ## What's Deployed
            - Instructor Agent (lesson generation)
            - Evaluator Agent (submission grading)
            - Compliance Agent (content review)
            - FastAPI with 11 endpoints
            - PostgreSQL integration

            ## Status
            ✅ All tests passed
            ✅ Security scan passed
            ✅ Smoke tests passed
            ✅ Health check passed
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
