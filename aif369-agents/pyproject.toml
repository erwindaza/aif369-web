[tool.poetry]
name = "aif369-agents"
version = "0.1.0"
description = "Multi-agent orchestration system: Mistral 7B + Llama 70B with zero-latency queue"
authors = ["erwindaza <erwin.daza@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
langchain = "^0.3.4"
langgraph = "^0.1.35"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
redis = "^5.0.1"
apscheduler = "^3.10.4"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
aioredis = "^2.0.1"
ollama = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
black = "^24.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
